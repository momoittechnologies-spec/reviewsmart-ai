<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  
  <!-- Circular Base -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="10" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" opacity="0.6" />
  
  <!-- Outer Ring Elements -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
  
  <!-- Center Open Book Icon -->
  <g transform="translate(150, 110)">
    <!-- Rays of Knowledge -->
    <path d="M 100 20 L 100 0 M 65 30 L 50 15 M 135 30 L 150 15 M 35 55 L 20 45 M 165 55 L 180 45" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Lamp of Wisdom -->
    <path d="M 92 48 Q 100 35 108 48 Q 100 58 92 48 Z" fill="#fbbf24" />
    
    <!-- Open Book Pages -->
    <path d="M 100 70 Q 55 60 10 70 L 10 145 Q 55 135 100 148 Q 145 135 190 145 L 190 70 Q 145 60 100 70 Z" fill="#ffffff" opacity="0.95" />
    <path d="M 100 70 L 100 148" stroke="#0f172a" stroke-width="3" />
    <path d="M 100 148 L 100 158" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    
    <!-- Page Lines Left -->
    <line x1="28" y1="88" x2="85" y2="84" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="28" y1="102" x2="85" y2="98" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="28" y1="116" x2="75" y2="112" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="28" y1="130" x2="80" y2="126" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Page Lines Right -->
    <line x1="115" y1="84" x2="172" y2="88" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="115" y1="98" x2="172" y2="102" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="115" y1="112" x2="162" y2="116" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="115" y1="126" x2="167" y2="130" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  </g>
  
  <!-- Text: ASHOK YADAV -->
  <text x="250" y="305" font-family="'Segoe UI', 'Arial', sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    ASHOK YADAV
  </text>
  
  <!-- Text: STUDY HALL -->
  <text x="250" y="348" font-family="'Segoe UI', 'Arial', sans-serif" font-size="28" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">
    STUDY HALL
  </text>
  
  <!-- Divider -->
  <line x1="120" y1="372" x2="380" y2="372" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  
  <!-- Star Badges -->
  <g transform="translate(250, 395)" fill="#fbbf24">
    <path d="M 0 -7 L 2 -2 L 7 -2 L 3 1 L 5 6 L 0 3 L -5 6 L -3 1 L -7 -2 L -2 -2 Z" />
    <path transform="translate(-30, 0)" d="M 0 -7 L 2 -2 L 7 -2 L 3 1 L 5 6 L 0 3 L -5 6 L -3 1 L -7 -2 L -2 -2 Z" />
    <path transform="translate(30, 0)" d="M 0 -7 L 2 -2 L 7 -2 L 3 1 L 5 6 L 0 3 L -5 6 L -3 1 L -7 -2 L -2 -2 Z" />
  </g>
  
  <!-- Location & Estd: KADAPA • ESTD 2020 -->
  <text x="250" y="425" font-family="'Segoe UI', 'Arial', sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="3">
    KADAPA • ESTD 2020
  </text>
  
  <!-- Subtitle: AC READING ROOM -->
  <text x="250" y="445" font-family="'Segoe UI', 'Arial', sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
    5:00 AM - 11:00 PM
  </text>
</svg>